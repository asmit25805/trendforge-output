[package]
name = "chameleon-browser"
version = "0.1.0"
edition = "2021"
description = "Multi‑persona Chromium launcher with native fingerprint injection via a side‑car gRPC PersonaEngine."
repository = "https://github.com/asmit25805/chameleon-browser"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["chromium", "automation", "fingerprint", "grpc", "persona"]
categories = ["command-line-utilities", "web-programming", "development-tools"]

[dependencies]
tonic = { version = "0.11", features = ["transport"] }
prost = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
rusqlite = { version = "0.30", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
tempfile = "3.8"
tokio = { version = "1.35", features = ["full"] }
anyhow = "1.0"
chromium-launcher = "0.2"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"

[features]
default = ["cli"]
cli = ["clap"]
```