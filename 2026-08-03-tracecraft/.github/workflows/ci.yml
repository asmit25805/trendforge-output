name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SQLITE_DB: ${{ runner.temp }}/ci_run_history.db
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: clippy

      - name: Log start of clippy
        run: echo "[INFO] Starting cargo clippy"

      - name: Run cargo clippy
        id: clippy
        run: |
          start=$(date +%s)
          cargo clippy -- -D warnings
          status=$?
          end=$(date +%s)
          duration=$((end - start))
          echo "status=$status" >> $GITHUB_OUTPUT
          echo "duration=$duration" >> $GITHUB_OUTPUT
          echo "[INFO] cargo clippy completed with status $status in ${duration}s"

      - name: Record clippy result
        run: |
          python3 - <<'PY'
import os, sqlite3, time
db_path = os.getenv('SQLITE_DB')
conn = sqlite3.connect(db_path)
c = conn.cursor()
c.execute('CREATE TABLE IF NOT EXISTS runs (id INTEGER PRIMARY KEY AUTOINCREMENT, step TEXT, status INTEGER, duration INTEGER, timestamp TEXT)')
c.execute(
    'INSERT INTO runs (step, status, duration, timestamp) VALUES (?,?,?,?)',
    ('cargo clippy', int(os.getenv('CLIPPY_STATUS')), int(os.getenv('CLIPPY_DURATION')), time.strftime('%Y-%m-%d %H:%M:%S'))
)
conn.commit()
conn.close()
PY
        env:
          CLIPPY_STATUS: ${{ steps.clippy.outputs.status }}
          CLIPPY_DURATION: ${{ steps.clippy.outputs.duration }}

      - name: Log start of tests
        run: echo "[INFO] Starting cargo test"

      - name: Run cargo test
        id: test
        run: |
          start=$(date +%s)
          cargo test --quiet
          status=$?
          end=$(date +%s)
          duration=$((end - start))
          echo "status=$status" >> $GITHUB_OUTPUT
          echo "duration=$duration" >> $GITHUB_OUTPUT
          echo "[INFO] cargo test completed with status $status in ${duration}s"

      - name: Record test result
        run: |
          python3 - <<'PY'
import os, sqlite3, time
db_path = os.getenv('SQLITE_DB')
conn = sqlite3.connect(db_path)
c = conn.cursor()
c.execute('CREATE TABLE IF NOT EXISTS runs (id INTEGER PRIMARY KEY AUTOINCREMENT, step TEXT, status INTEGER, duration INTEGER, timestamp TEXT)')
c.execute(
    'INSERT INTO runs (step, status, duration, timestamp) VALUES (?,?,?,?)',
    ('cargo test', int(os.getenv('TEST_STATUS')), int(os.getenv('TEST_DURATION')), time.strftime('%Y-%m-%d %H:%M:%S'))
)
conn.commit()
conn.close()
PY
        env:
          TEST_STATUS: ${{ steps.test.outputs.status }}
          TEST_DURATION: ${{ steps.test.outputs.duration }}

      - name: Summarize run history
        run: |
          python3 - <<'PY'
import os, sqlite3, json
db_path = os.getenv('SQLITE_DB')
conn = sqlite3.connect(db_path)
c = conn.cursor()
c.execute('SELECT step, status, duration, timestamp FROM runs ORDER BY id')
rows = c.fetchall()
summary = [
    {"step": step, "status": status, "duration_s": duration, "timestamp": timestamp}
    for step, status, duration, timestamp in rows
]
print("[INFO] Run history:")
print(json.dumps(summary, indent=2))
conn.close()
PY