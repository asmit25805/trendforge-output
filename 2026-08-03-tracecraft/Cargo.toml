[package]
name = "tracecraft"
version = "0.1.0"
edition = "2021"
description = "Capture developer sessions and generate CI/CD pipelines with AI assistance"
repository = "https://github.com/asmit25805/tracecraft"
homepage = "https://github.com/asmit25805/tracecraft"
readme = "README.md"
keywords = ["recording", "ci", "cd", "ai", "pipeline"]
categories = ["development-tools::debugging", "command-line-utilities"]
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "gzip", "rustls-tls"] }
uuid = { version = "1.4", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.10"
anyhow = "1.0"
thiserror = "1.0"
tera = "1.19"
lru = "0.9"
futures = "0.3"

[dev-dependencies]
assert_cmd = "2.0"
tempfile = "3.8"
predicates = "3.0"

[features]
default = ["cache"]
cache = ["lru"]
network = ["reqwest"]
all = ["cache", "network"]