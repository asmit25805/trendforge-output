[package]
name = "rope-meld"
version = "0.1.0"
edition = "2021"
description = "A rope‑backed piece‑table engine with built‑in CRDT for real‑time collaborative markdown editing"
repository = "https://github.com/asmit25805/rope-meld"
homepage = "https://github.com/asmit25805/rope-meld"
license = "MIT OR Apache-2.0"
keywords = ["rope", "piece-table", "crdt", "markdown", "wasm"]
categories = ["text-editors", "collaboration", "wasm"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
uuid = { version = "1.3", features = ["v4"] }
rope = "1.10" # Added to provide `rope::Rope` used in the engine

[dev-dependencies]
clap = { version = "4.3", features = ["derive"] }

[lib]
crate-type = ["cdylib", "rlib"]
